<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;600;700&display=swap');

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  img, input, select, textarea, button {
    max-width: 100%;
  }

  :root {
    --green-dark: hsl(108, 55%, 22%);
    --green-mid: hsl(108, 56%, 35%);
    --green-light: hsl(88, 48%, 93%);
    --green-border: hsl(92, 45%, 72%);
    --text-main: hsl(0, 0%, 10%);
    --text-sub: hsl(0, 0%, 35%);
    --text-hint: hsl(0, 0%, 56%);
    --bg: hsl(88, 20%, 97%);
    --surface: hsl(0, 0%, 100%);
    --border: hsl(60, 6%, 87%);
    --danger: hsl(6, 63%, 46%);
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.04);
    --shadow-premium: 0 10px 30px rgba(45, 106, 31, 0.08);
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .app-header {
    background: rgba(45, 106, 31, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
  }

  .app-header .logo { font-size: 20px; }
  .app-header h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }

  .app-header .badge {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    background: rgba(255,255,255,0.25);
    padding: 3px 10px;
    border-radius: 10px;
  }

  .progress-wrap {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px 14px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 8px;
    font-weight: 500;
  }

  .progress-bar {
    height: 6px;
    background: hsl(0, 0%, 90%);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--green-mid);
    border-radius: 3px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 20px 100px;
    width: 100%;
  }

  .step {
    display: none;
    opacity: 0;
  }
  .step.active {
    display: block;
    animation: stepFadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes stepFadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .step-title {
    font-family: 'Outfit', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 8px;
    line-height: 1.35;
    letter-spacing: -0.3px;
  }

  .step-desc {
    font-size: 14px;
    color: var(--text-sub);
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .section-label {
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--green-dark);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin: 24px 0 14px;
    padding-bottom: 6px;
    border-bottom: 1.5px solid var(--green-border);

  .field { margin-bottom: 20px; }

    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 8px;

  .field-hint {

  .input-row {

    overflow: hidden;
    box-shadow: var(--shadow-soft);
    transition: border-color var(--transition);

  }
  .stepper:focus-within {
    border-color: var(--green-mid);
  }
  .stepper .btn-step {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: hsl(0, 0%, 98%);
    border: none;
    color: var(--text-main);
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, transform 0.1s;
    touch-action: manipulation;
  }
  .stepper .btn-step:active {
    background: hsl(0, 0%, 93%);
    transform: scale(0.92);
  }
  .stepper input[type="number"] {
    width: 68px;
    height: 44px;
    border: none;
    border-radius: 0;
    text-align: center;
    padding: 0;
    font-weight: 700;
    font-size: 16px;
    background: var(--surface);
    -moz-appearance: textfield;
  }
  .stepper input[type="number"]::-webkit-outer-spin-button,
  .stepper input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 500;
    color: var(--text-main);
    background: var(--surface);
    box-shadow: var(--shadow-soft);
    transition: var(--transition);
    -webkit-appearance: none;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--green-mid);
    box-shadow: 0 0 0 3px rgba(59, 140, 40, 0.15);
  }

  .unit {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-sub);
    white-space: nowrap;
  }

  .radio-group { display: flex; flex-direction: column; gap: 10px; }

  .radio-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    cursor: pointer;
    background: var(--surface);
    box-shadow: var(--shadow-soft);
    transition: var(--transition);
    touch-action: manipulation;
  }

  .radio-card:hover { border-color: var(--green-border); }
  .radio-card.selected { border-color: var(--green-mid); background: var(--green-light); }
  .radio-card:active { transform: scale(0.98); }

  .radio-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;

  }

  .radio-card.selected .radio-dot {

    background: var(--green-mid);
  }

  .radio-card.selected .radio-dot::after {
    content: '';

    background: white;
    border-radius: 50%;
  }

  .radio-text { font-size: 14px; font-weight: 600; color: var(--text-main); flex: 1; }
  .radio-sub { font-size: 11px; font-weight: 500; color: var(--text-hint); margin-left: auto; }

  .toggle-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    box-shadow: var(--shadow-soft);
  }

  .toggle-label { font-size: 14px; font-weight: 600; color: var(--text-main); }
  .toggle-hint { font-size: 11px; color: var(--text-hint); margin-top: 3px; }

  .toggle-switch {
    position: relative;
    width: 46px; height: 26px;
    flex-shrink: 0;
  }

  .toggle-switch input { opacity: 0; width: 0; height: 0; }

  .toggle-slider {
    position: absolute;
    inset: 0;
    background: hsl(0, 0%, 82%);
    border-radius: 26px;
    cursor: pointer;
    transition: var(--transition);
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    height: 20px; width: 20px;
    left: 3px; bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: var(--transition);
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  }

  .toggle-switch input:checked + .toggle-slider { background: var(--green-mid); }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
  }

  .food-card {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 12px;
    background: var(--surface);
    box-shadow: var(--shadow-soft);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .food-name { font-size: 13px; color: var(--text-main); margin-bottom: 4px; font-weight: 700; }
  .food-co2 { font-size: 10px; color: var(--text-hint); margin-bottom: 10px; line-height: 1.3; }

  .item-card {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    background: var(--surface);
    margin-bottom: 12px;
    box-shadow: var(--shadow-soft);
  }

  .item-card .field-label { margin-bottom: 10px; }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  .tip-box {
    background: var(--green-light);
    border: 1px solid var(--green-border);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    font-size: 12px;
    color: var(--green-dark);
    margin-top: 12px;
    line-height: 1.6;
    font-weight: 500;
  }

  .info-box {
    background: hsl(48, 100%, 96%);
    border: 1px solid hsl(48, 80%, 75%);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    font-size: 12px;
    color: hsl(40, 100%, 25%);
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .info-box strong { color: hsl(40, 100%, 18%); }

  .notice-box {
    background: hsl(48, 100%, 96%);
    border: 1px solid hsl(48, 80%, 75%);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    font-size: 13px;
    color: hsl(40, 100%, 25%);
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .notice-box strong { color: hsl(40, 100%, 18%); }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 32px;
  }

  .btn {
    flex: 1;
    padding: 15px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-main);
    transition: var(--transition);
    touch-action: manipulation;
  }

  .btn:hover { background: hsl(0, 0%, 96%); }
  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: var(--green-dark);
    color: white;
    border-color: var(--green-dark);
    box-shadow: 0 4px 12px rgba(45, 106, 31, 0.15);
  }

  .btn-primary:hover { background: var(--green-mid); border-color: var(--green-mid); }

  /* 결과 등급 카드 디자인 고도화 (Premium Card) */
  .char-card {
    background: linear-gradient(135deg, #ffffff 0%, #f4f9f1 100%);
    border: 2px solid var(--green-border);
    border-radius: 20px;
    padding: 24px 20px;
    margin: 24px 0;
    box-shadow: var(--shadow-premium);
    text-align: center;
    position: relative;
    overflow: hidden;
    animation: cardPop 0.50s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes cardPop {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .char-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(59,140,40,0.02) 0%, transparent 70%);
    pointer-events: none;
  }

  .char-card h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--green-dark);
    font-weight: 700;
    margin-bottom: 8px;
  }

  .char-card h2 {
    font-family: 'Outfit', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 12px;
  }

  .char-card img {
    width: 140px;
    height: 140px;
    object-fit: contain;
    border-radius: 16px;
    border: 3px solid var(--green-border);
    background: #ffffff;
    padding: 6px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.04);
    margin: 12px 0;
    transition: transform 0.3s ease;
  }

  .char-card p {
    font-size: 15px;
    font-weight: 700;
    color: var(--green-dark);
    background: rgba(45, 106, 31, 0.06);
    padding: 8px 18px;
    border-radius: 30px;
    display: inline-block;
    margin-top: 8px;
  }

  /* 결과 화면 */
  .result-hero {
    text-align: center;
    padding: 24px 0 20px;
  }

  .result-hero .name { font-size: 18px; font-weight: 700; color: var(--green-dark); }
  .result-hero .month-val { font-family: 'Outfit', sans-serif; font-size: 52px; font-weight: 800; color: var(--text-main); line-height: 1.1; margin: 8px 0 2px; }
  .result-hero .month-unit { font-size: 14px; color: var(--text-sub); font-weight: 500; }

  .result-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 16px 0;
  }

  .result-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    box-shadow: var(--shadow-soft);
  }

  .result-card .label { font-size: 11px; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; }
  .result-card .value { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800; color: var(--text-main); }
  .result-card .unit2 { font-size: 11px; color: var(--text-hint); margin-top: 3px; font-weight: 500; }

  .tree-info {
    background: var(--green-light);
    border: 1px solid var(--green-border);
    border-radius: var(--radius-md);
    padding: 16px;
    margin: 16px 0;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    box-shadow: var(--shadow-soft);
  }

  .tree-info .tree-icon { font-size: 28px; flex-shrink: 0; }
  .tree-info .tree-text { font-size: 13px; color: var(--green-dark); line-height: 1.7; font-weight: 500; }
  .tree-info .tree-text strong { font-weight: 700; }

  .breakdown-title {
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-sub);
    margin: 24px 0 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .breakdown-item {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .bd-name { font-size: 13px; font-weight: 600; color: var(--text-main); width: 72px; flex-shrink: 0; }

  .bd-bar-wrap {
    flex: 1;
    height: 8px;
    background: hsl(0, 0%, 91%);
    border-radius: 4px;
    overflow: hidden;
  }

  .bd-bar { height: 100%; background: var(--green-mid); border-radius: 4px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

  .bd-val { font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 600; color: var(--text-sub); width: 56px; text-align: right; flex-shrink: 0; }

  .save-status {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    padding: 10px;
    border-radius: var(--radius-md);
    margin-top: 16px;
  }

  .save-status.saving { color: var(--text-sub); background: hsl(0, 0%, 94%); }
  .save-status.success { color: var(--green-dark); background: var(--green-light); border: 1px solid var(--green-border); }
  .save-status.fail { color: var(--danger); background: hsl(6, 100%, 97%); border: 1px solid hsl(6, 100%, 90%); }

  @media (max-width: 480px) {
    .grid-2 { grid-template-columns: 1fr; }
    .result-cards { grid-template-columns: 1fr 1fr; }
    .step-title { font-size: 20px; }
    .container { padding: 16px 16px 80px; }
  }
</style>
<script>
// 키보드로 입력할 수 있는 상한값. 표에 없는 칸은 DEFAULT_MAX를 적용합니다.
const DEFAULT_MAX = 200;
const INPUT_MAX = {
  family: 20, shower_min: 120, commute_min: 300, weekend_min: 600,
  commute_km: 300, weekend_km: 1000,
  boiler_hr: 24, aircon_hr: 24, tv: 24, pc: 24, phone_hr: 24, streaming_hr: 24, gaming_hr: 24,
  flight_dom: 20, flight_short: 20, flight_long: 20, dog: 20, cat: 20
};

function adjustVal(id, amount, min = 0) {
  const el = document.getElementById(id);
  if (!el) return;
  let val = Number(el.value) || 0;
  val = Math.max(min, Math.min(INPUT_MAX[id] || DEFAULT_MAX, val + amount));
  el.value = val;
  if (id === 'shower_min') {
    const displayEl = document.getElementById('shower_display');
    if (displayEl) displayEl.textContent = val;
  }
}

// 직접 입력한 값도 음수나 비현실적으로 큰 값이 되지 않도록 범위 안으로 맞춥니다.
document.addEventListener('change', e => {
  const el = e.target;
  if (el.type !== 'number' || el.value === '') return;
  el.value = Math.max(Number(el.min) || 0, Math.min(INPUT_MAX[el.id] || DEFAULT_MAX, Number(el.value) || 0));
});

// 빈칸은 0으로 계산되므로, 예시값이 0이 아닌 칸은 비워둔 채 넘어가지 못하게 합니다.
function checkBlankInputs(step) {
  const blank = Array.from(document.querySelectorAll('#s' + step + ' input[type="number"]'))
    .find(el => el.value === '' && Number(el.placeholder) > 0 && el.offsetParent !== null);
  if (!blank) return true;
  alert('아직 입력하지 않은 칸이 있어요.\n해당 없으면 0을 입력해주세요.');
  blank.focus();
  return false;
}

function getTierInfo(monthlyEmission) {
  const m = Number(monthlyEmission);
  return TIERS.find(t => m <= t.max) || TIERS[TIERS.length - 1];
}

function showTierCard(monthly) {
  const tierInfo = getTierInfo(monthly);
  document.getElementById('character-box').style.display = 'block';
  document.getElementById('char-tier-name').innerText = tierInfo.tier + " : " + tierInfo.character;
  document.getElementById('char-message').innerText = '"' + tierInfo.msg + '"';
  document.getElementById('char-image').src = tierInfo.img;
}

function saveResult(payload) {
  const saveEl = document.getElementById('saveStatus');
  const retryEl = document.getElementById('retrySave');
  retryEl.style.display = 'none';
  saveEl.className = 'save-status saving';
  saveEl.textContent = '결과를 저장하는 중...';

  if (typeof google === 'undefined' || !google.script) {
    saveEl.className = 'save-status success';
    saveEl.textContent = '(로컬 미리보기 중 - 배포 후 저장 기능 활성화)';
    return;
  }

  const showFail = message => {
    saveEl.className = 'save-status fail';
    saveEl.textContent = '저장 실패: ' + message;
    retryEl.style.display = 'block';
    retryEl.onclick = () => saveResult(payload);
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        saveEl.className = 'save-status success';
        saveEl.textContent = '✓ 결과가 저장됐어요!';
      } else {
        showFail(res.error || '오류');
      }
    })
    .withFailureHandler(showFail)
    .saveToSheet(payload);
}
</script>
